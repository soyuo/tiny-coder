[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-coder"
version = "0.1.0"
description = "A CPU-only, disk-backed runtime for memory-constrained code generation models."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tensor = ["numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tinycode = "tinycode.cli:main"

[tool.setuptools.packages.find]
include = ["tinycode*"]
